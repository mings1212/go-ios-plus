# Release pipeline — triggered by publishing a Release in the GitHub UI.
#
# 在网页上 "Draft a new release" -> 新建/选择 tag -> "Publish release" 后自动触发：
# 1. Windows / macOS 两个 runner 各自编译（mac 用 lipo 合并 arm64+amd64 通用二进制）
# 2. Linux 在 ubuntu runner 上交叉编译（无需 linux 专属机器）
# 3. 最后把 go-ios-windows.zip / go-ios-mac.zip / go-ios-linux.zip 传回本次 release
#
# 版本号取自触发的 tag（vX.Y.Z -> X.Y.Z），编译前替换 main.go 里的 "local-build"。
# 使用默认 GITHUB_TOKEN（upload job 需 contents: write），无需配置 RELEASE_PAT。
# 不包含 npm 发布 / CHANGELOG 回写 / Discord 通知。
#
# 已存在的旧 release 不会补跑：删掉 release（保留 tag）重新 Publish 即可重新触发。
on:
  release:
    types: [published]

name: Release-Go-iOS

permissions:
  contents: read

jobs:
  build_on_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          (Get-Content -path main.go -Raw) -replace "local-build", "$version" | Set-Content -Path main.go
          mkdir bin
          go build -ldflags="-s -w" -o bin/ios.exe .
          Compress-Archive -Path .\bin\ios.exe -CompressionLevel Optimal -DestinationPath go-ios-windows.zip

      - name: upload the windows build
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: go-ios-windows.zip
          retention-days: 1
          overwrite: true

  build_on_mac:
    runs-on: macos-latest
    needs: build_on_windows
    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          brew install gnu-sed
          gsed -i "s/version = \"local-build\"/version = \"$VERSION\"/" main.go
          mkdir bin
          GOARCH=arm64 go build -ldflags="-s -w" -o bin/ios-arm64 .
          GOARCH=amd64 go build -ldflags="-s -w" -o bin/ios-amd64 .
          lipo bin/ios-amd64 bin/ios-arm64 -create -output bin/ios
          zip -j go-ios-mac.zip bin/ios

      - name: upload the macos build
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: go-ios-mac.zip
          retention-days: 1
          overwrite: true

  upload_release:
    runs-on: ubuntu-latest
    needs: [build_on_windows, build_on_mac]
    permissions:
      contents: write # gh release upload 需要写 release 权限
    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download mac build from previous job
        uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: ./mac-bin

      - name: Download windows build from previous job
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: ./win-bin

      - name: Build linux and upload all assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/version = \"local-build\"/version = \"$VERSION\"/" main.go
          mkdir bin
          GOARCH=arm64 go build -ldflags="-s -w" -o bin/ios-arm64 .
          GOARCH=amd64 go build -ldflags="-s -w" -o bin/ios-amd64 .
          zip -j go-ios-linux.zip bin/ios-arm64 bin/ios-amd64
          # 三个平台的 zip 一并挂回本次发布的 release（--clobber 允许重跑覆盖）
          gh release upload "$GITHUB_REF_NAME" --clobber \
            go-ios-linux.zip ./mac-bin/go-ios-mac.zip ./win-bin/go-ios-windows.zip
