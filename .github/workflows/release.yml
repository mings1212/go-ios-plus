# Release pipeline — simplified for personal fork.
#
# 单 job 全平台交叉编译（linux runner 上 GOOS/GOARCH 交叉编译 win/mac/linux），
# 产物 zip 直接挂到 GitHub Release，使用默认 GITHUB_TOKEN，无需配置任何 secret。
#
# 触发：Actions → Release-Go-iOS → Run workflow
#   或 `gh workflow run release.yml -f version=0.1.0 -f release_notes="- xxx"`
# 版本号：优先取输入的 version；留空则取最新 v* tag 做 minor bump；无 tag 时从 0.1.0 开始。
#
# 注意：macOS 的 lipo（合并通用二进制）只能在 mac runner 上执行，这里改为
# arm64/amd64 两个独立 zip；如需通用二进制需自行在 mac 上合并。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.1.0），留空则自动从最新 v* tag bump"
        required: false
        type: string
      release_notes:
        description: "Release notes (markdown)"
        required: false
        type: string

name: Release-Go-iOS

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 需要全部 tag 计算版本号

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            LATEST="$(git tag -l 'v*' | sort -V | tail -1)"
            LATEST="${LATEST#v}"
            if [ -z "$LATEST" ]; then
              LATEST="0.0.0"
            fi
            IFS=. read -r MA MI PA <<< "$LATEST"
            VERSION="${MA}.${MI}.$((PA + 1))"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: v${VERSION}"

      - name: Build all platforms
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          sed -i 's/version \= \"local-build\"/version = \"'"${VERSION}"'\"/' main.go
          mkdir -p bin
          LDFLAGS="-s -w"
          # windows
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/ios.exe .
          zip -j go-ios-win.zip bin/ios.exe
          # mac（arm64 + amd64 分开打包）
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o bin/ios-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/ios-amd64 .
          zip -j go-ios-mac-arm64.zip bin/ios-arm64
          zip -j go-ios-mac-amd64.zip bin/ios-amd64
          # linux
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/ios-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o bin/ios-linux-arm64 .
          zip -j go-ios-linux.zip bin/ios-linux-amd64 bin/ios-linux-arm64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.release_notes }}" ]; then
            printf 'go-ios-plus v%s\n' "${VERSION}" > /tmp/notes.md
          else
            printf '%s' "${{ inputs.release_notes }}" > /tmp/notes.md
          fi
          gh release create "v${VERSION}" \
            go-ios-win.zip go-ios-mac-arm64.zip go-ios-mac-amd64.zip go-ios-linux.zip \
            --title "v${VERSION}" \
            --notes-file /tmp/notes.md \
            --target "$GITHUB_SHA"
